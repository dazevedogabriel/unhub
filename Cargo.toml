[package]
name = "unhub"
version = "0.1.0"
edition = "2021"
description = "Configurador leve para mouses Logitech G com fio (sem G HUB)"

[[bin]]
name = "unhub"
path = "src/main.rs"

[build-dependencies]
resvg = "0.45"
winresource = "0.1"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "accesskit"] }
hidapi = "2"
rfd = "0.17"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
